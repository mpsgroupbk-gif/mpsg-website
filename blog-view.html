<!DOCTYPE html>
<html lang="gu" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>રક્તદાન મહાદાન - MPSG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandRed: '#b91c1c',     /* ગ્રુપનો લાલ કલર */
                        brandOrange: '#f97316',  /* ગ્રુપનો કેસરી કલર */
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        /* Lightbox અને Grid માટે હોવર ઇફેક્ટ */
        .gallery-img { transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: zoom-in; }
        .gallery-img:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(0,0,0,0.2); z-index: 10; position: relative; }
        .glass-nav { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0, 0, 0, 0.05); }
        /* બ્લોગના લખાણને સુંદર બનાવવા માટેની સ્પેશિયલ ડીઝાઈન */
        .blog-content p { margin-bottom: 1.5rem; line-height: 1.8; font-size: 1.1rem; text-align: justify; }
        .blog-content strong { color: #b91c1c; }
        .dark .blog-content strong { color: #f97316; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-500 min-h-screen flex flex-col">

    <!-- Navbar સાવ સિમ્પલ અને Back બટન સાથે -->
    <nav class="glass-nav bg-brandRed/95 dark:bg-gray-900/95 text-white shadow-lg sticky top-0 z-50 transition-colors duration-500">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                
                <!-- Back Button (પાછા મેઈન પેજ પર જવા) -->
                <a href="index.html#blood-stats" class="flex items-center text-white hover:text-yellow-300 font-bold transition duration-300 bg-white/10 px-4 py-2 rounded-full border border-white/20 hover:bg-white/20">
                    <i class="fa-solid fa-arrow-left mr-2"></i> પાછા જાઓ
                </a>
                
                <!-- Title -->
                <div class="hidden sm:flex items-center">
                    <span class="font-bold text-xl tracking-wider"><i class="fa-solid fa-shield-halved mr-2"></i>MPSG બનાસકાંઠા</span>
                </div>
                
                <!-- Dark Mode Toggle -->
                <button onclick="toggleTheme()" class="text-xl hover:text-yellow-300 transition duration-300 bg-white/10 w-10 h-10 rounded-full flex items-center justify-center border border-white/20">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>

            </div>
        </div>
    </nav>

    <main class="flex-grow pt-8 pb-16">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <!-- લોડિંગ સ્પિનર -->
            <div id="loading-spinner" class="flex flex-col items-center justify-center py-20 text-gray-500 mt-10">
                <i class="fa-solid fa-spinner fa-spin text-5xl text-brandRed mb-4"></i>
                <p class="font-bold text-lg">માહિતી શોધાઈ રહી છે...</p>
            </div>

            <!-- જો ડેટા ના મળે તો એરર મેસેજ -->
            <div id="error-message" class="hidden text-center py-20 mt-10 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
                <i class="fa-solid fa-file-circle-xmark text-6xl text-gray-300 dark:text-gray-600 mb-4 block"></i>
                <h3 class="text-xl font-bold text-brandRed mb-2">માહિતી ઉપલબ્ધ નથી!</h3>
                <p class="text-gray-500 font-medium">આ વર્ષના રક્તદાન કેમ્પની માહિતી હજુ અપડેટ કરવામાં આવી નથી.</p>
            </div>

            <!-- ૧. ટાઇટલ અને તારીખ (Optional) -->
            <div id="blog-header" class="text-center mb-10 hidden" data-aos="fade-up">
                <h1 id="blog-title" class="text-3xl md:text-5xl font-black text-brandRed dark:text-brandOrange drop-shadow-sm mb-4 leading-tight"></h1>
                <p id="blog-date" class="text-gray-600 dark:text-gray-400 font-bold tracking-widest uppercase inline-block bg-gray-200 dark:bg-gray-800 px-4 py-2 rounded-full text-sm"></p>
            </div>

            <!-- ૨. ફોટાની મસ્ત ગ્રીડ ગેલેરી -->
            <div id="blog-gallery-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 mb-12 hidden" data-aos="fade-up" data-aos-delay="100">
                <!-- JavaScript થી અહી ફોટા આવશે -->
            </div>

            <!-- ૩. બ્લોગનો લેખ (Optional) -->
            <div id="blog-content-container" class="hidden max-w-4xl mx-auto bg-white dark:bg-gray-800 p-6 md:p-10 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700" data-aos="fade-up" data-aos-delay="200">
                <div id="blog-content-area" class="blog-content text-gray-700 dark:text-gray-300">
                    <!-- JavaScript થી લખાણ અહી આવશે -->
                </div>
            </div>

        </div>
    </main>

    <!-- ફૂલ સ્ક્રીન ફોટો જોવા માટે Lightbox (Modal) -->
    <div id="lightbox-modal" class="fixed inset-0 z-[100] bg-black/95 hidden flex justify-center items-center opacity-0 transition-opacity duration-300 backdrop-blur-sm">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-white/70 hover:text-brandRed text-4xl bg-black/50 w-12 h-12 rounded-full flex items-center justify-center transition-colors z-[110]"><i class="fa-solid fa-xmark"></i></button>
        <div class="relative w-full h-full p-4 md:p-12 flex justify-center items-center" onclick="closeLightbox()">
            <img id="lightbox-img" src="" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl" onclick="event.stopPropagation();">
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 py-6 text-center mt-auto">
        <p>© 2026 મહારાણા પ્રતાપ સેવા ગ્રુપ - બનાસકાંઠા. સર્વાધિકાર સુરક્ષિત.</p>
        <p class="text-sm mt-2">Design & Developed with <i class="fa-solid fa-heart text-brandRed"></i> by MPSG Team</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <!-- Swiper JS -->
    <script>
        AOS.init({ once: true });

        // ડાર્ક મોડ કંટ્રોલ
        const htmlTag = document.documentElement;
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlTag.classList.add('dark');
        }

        const icon = document.getElementById('theme-icon');
        if (icon && htmlTag.classList.contains('dark')) icon.className = 'fa-solid fa-sun';

        function toggleTheme() {
            htmlTag.classList.toggle('dark');
            localStorage.setItem('theme', htmlTag.classList.contains('dark') ? 'dark' : 'light');
            if (icon) icon.className = htmlTag.classList.contains('dark') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        // --- Lightbox Functions ---
        const modal = document.getElementById('lightbox-modal');
        const modalImg = document.getElementById('lightbox-img');

        function openLightbox(imgUrl) {
            modalImg.src = imgUrl;
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
            document.body.style.overflow = 'hidden'; // પાછળનું પેજ સ્ક્રોલ ના થાય
        }

        function closeLightbox() {
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                modalImg.src = "";
                document.body.style.overflow = 'auto';
            }, 300);
        }

        // સ્માર્ટ બ્લોગ લોડર (URL માંથી વર્ષ પકડીને)
        const urlParams = new URLSearchParams(window.location.search);
        const year = urlParams.get('year');

        async function loadBlogData() {
            const headerDiv = document.getElementById('blog-header');
            const titleEl = document.getElementById('blog-title');
            const dateEl = document.getElementById('blog-date');
            
            const gridDiv = document.getElementById('blog-gallery-grid');
            
            const contentContainer = document.getElementById('blog-content-container');
            const contentArea = document.getElementById('blog-content-area');
            
            const spinner = document.getElementById('loading-spinner');
            const errorMsg = document.getElementById('error-message');

            if(!year) {
                 spinner.classList.add('hidden');
                 errorMsg.classList.remove('hidden');
                 errorMsg.innerHTML = '<h3 class="text-xl font-bold text-brandRed mb-2">વર્ષ પસંદ કરેલ નથી!</h3>';
                 return;
            }

            try {
                const jsonUrl = `https://raw.githubusercontent.com/mpsgroupbk-gif/mpsg-website/main/data/blogs/blog_${year}.json?t=${new Date().getTime()}`;
                const response = await fetch(jsonUrl);
                spinner.classList.add('hidden');

                if(!response.ok) {
                    errorMsg.classList.remove('hidden');
                    return;
                }

                const data = await response.json();

                if(Object.keys(data).length === 0 || (!data.title && !data.content && (!data.images || data.images.length === 0))) {
                    errorMsg.classList.remove('hidden');
                    return;
                }

                // ૧. ટાઇટલ અને તારીખ સેટ કરો (જો હોય તો જ બતાવો)
                if (data.title && data.title.trim() !== "") {
                    titleEl.innerText = data.title;
                    headerDiv.classList.remove('hidden');
                    
                    if (data.date && data.date.trim() !== "") {
                        dateEl.innerHTML = `<i class="fa-solid fa-calendar-check mr-2 text-brandRed"></i>${data.date}`;
                        dateEl.classList.remove('hidden');
                    } else {
                        dateEl.classList.add('hidden');
                    }
                }

                // ૨. ફોટાની ગ્રીડ સેટ કરો
                let imagesArray = [];
                if (data.images && Array.isArray(data.images) && data.images.length > 0) {
                    imagesArray = data.images;
                } else if (data.imageFileName && data.imageFileName.trim() !== "") {
                    imagesArray = [data.imageFileName];
                }

                if (imagesArray.length > 0) {
                    gridDiv.innerHTML = ""; // જૂનું ક્લિયર
                    imagesArray.forEach(imgName => {
                        const imgUrl = `https://raw.githubusercontent.com/mpsgroupbk-gif/mpsg-website/main/images/blogs/${imgName}`;
                        const gridItem = `
                        <div class="relative w-full h-48 md:h-64 rounded-xl overflow-hidden border-2 border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-sm gallery-img" onclick="openLightbox('${imgUrl}')">
                            <img src="${imgUrl}" alt="Gallery Image" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black/0 hover:bg-black/20 transition-colors duration-300 flex items-center justify-center">
                                <i class="fa-solid fa-expand text-white text-3xl opacity-0 hover:opacity-100 drop-shadow-md"></i>
                            </div>
                        </div>`;
                        gridDiv.insertAdjacentHTML('beforeend', gridItem);
                    });
                    gridDiv.classList.remove('hidden');
                }

                // ૩. લેખ (Content) સેટ કરો (જો હોય તો જ બતાવો)
                if(data.content && data.content.trim() !== "") {
                    const formattedContent = data.content.split('\n').map(p => p.trim() !== '' ? `<p>${p}</p>` : '').join('');
                    contentArea.innerHTML = formattedContent;
                    contentContainer.classList.remove('hidden');
                }

            } catch(error) {
                spinner.classList.add('hidden');
                errorMsg.classList.remove('hidden');
            }
        }

        // પેજ લોડ થાય એટલે તરત જ લેખ શોધવાનું ચાલુ કરો
        window.onload = loadBlogData;
    </script>
</body>
</html>
